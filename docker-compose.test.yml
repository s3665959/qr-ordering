services:
  mysql-test:
    image: mysql:8.4
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: ${TEST_MYSQL_DATABASE:-shabu_buffet_test}
      MYSQL_USER: ${TEST_MYSQL_USER:-shabu_test}
      MYSQL_PASSWORD: ${TEST_MYSQL_PASSWORD:?set TEST_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:?set TEST_MYSQL_ROOT_PASSWORD}
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:${TEST_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_test_data:
